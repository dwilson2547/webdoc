image:
  repository: dwilson2547/webdoc
  # A release from CHANGELOG.md. Bumping this is how a release reaches the
  # cluster; :latest is pushed too, but the chart doesn't follow it.
  tag: "0.8.0"
  pullPolicy: IfNotPresent

# Public (Traefik pubsecure, letsencrypt-prod, external-dns). Public domains are
# readable signed out; everything else needs an authentik session.
ingress:
  host: webdoc.danwils.com
  tlsSecretName: webdoc-danwils-tls

# Applied by hand; key DATABASE_URL (cluster Postgres).
databaseSecret: webdoc-db

# authentik OIDC client. The redirect URI derives from ingress.host.
oidc:
  issuer: https://auth.danwils.com/application/o/webdoc/
  clientId: webdoc
  secretName: webdoc-oidc   # key client_secret
  # Members of this authentik group are webdoc admins (design §4).
  adminGroup: webdoc-admins
  # Members are editors (create and write); everyone else is a read-only viewer.
  # Admins are editors too. Empty: everyone is an editor.
  editorGroup: webdoc-editors
  # Same LAN route to authentik as nodewright: the pod has no IPv6 route and
  # auth.danwils.com resolves to Cloudflare IPv6 only.
  hostAliases:
    - ip: 192.168.0.65
      hostnames:
        - auth.danwils.com

# Files attached to documents (design §3), in AIStor like nodewright's. The secret
# is hand-applied with keys S3_ACCESS_KEY / S3_SECRET_KEY. Leave s3Endpoint empty
# to switch attachments off (the UI hides uploads; nothing else changes).
attachments:
  s3Endpoint: http://192.168.0.10:30320
  bucket: webdoc
  secretName: webdoc-bucket-credentials
  maxBytes: 20971520

# One replica: migrations run at startup. The search embedding model runs
# in-process (~245Mi resident with it loaded, measured in a local container).
resources:
  requests:
    cpu: 50m
    memory: 320Mi
  limits:
    cpu: "1"
    memory: 768Mi

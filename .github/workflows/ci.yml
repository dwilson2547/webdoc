name: webdoc-ci

# Trunk flow: tests and the UI build gate every PR and every push to main;
# a push to main then publishes the image. Releases are still cut by bumping
# api/webdoc/__init__.py: the first main build of a new version also pushes
# :<version>, which is the tag the chart pins (helm/webdoc/values.yaml).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      service: ${{ steps.filter.outputs.service }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            service:
              - 'api/**'
              - 'ui/**'
              - 'Dockerfile'
              - '.dockerignore'
              - '.github/workflows/**'

  test:
    if: needs.changes.outputs.service == 'true'
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt
      - name: API tests
        working-directory: api
        run: |
          pip install -r requirements.txt pytest
          python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: UI type-check, lint and build
        working-directory: ui
        run: |
          npm ci --no-audit --no-fund
          npx oxlint src
          npm run build

  pr-image:
    if: github.event_name == 'pull_request' && needs.changes.outputs.service == 'true'
    needs: [changes, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t webdoc:ci .

  publish-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.service == 'true'
    needs: [changes, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: tags
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/webdoc
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' api/webdoc/__init__.py)
          {
            echo "tags<<EOF"
            echo "$IMAGE:sha-${GITHUB_SHA::12}"
            echo "$IMAGE:$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER}"
            echo "$IMAGE:latest"
            # A release tag is immutable once pushed: only the first build of a version gets it.
            if ! docker manifest inspect "$IMAGE:$version" >/dev/null 2>&1; then
              echo "$IMAGE:$version"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
